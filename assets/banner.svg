<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Yuri Walczak — Desenvolvedor Back-end</title>
  <desc id="desc">Banner escuro com detalhes de código e a identificação profissional de Yuri Walczak.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="55%" stop-color="#111c35" />
      <stop offset="100%" stop-color="#0b3a4a" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)" />
  <rect width="1200" height="300" rx="24" fill="url(#grid)" />
  <circle cx="1030" cy="70" r="170" fill="#22d3ee" fill-opacity="0.08" />
  <circle cx="1090" cy="250" r="150" fill="#2dd4bf" fill-opacity="0.07" />

  <g fill="none" stroke="url(#accent)" stroke-linecap="round" filter="url(#glow)" opacity="0.82">
    <path d="M820 54h92l24 24h116" stroke-width="3" />
    <path d="M875 126h60l23-23h88" stroke-width="2" />
    <path d="M805 210h84l28-28h145" stroke-width="2" />
    <path d="M1014 78v36m-77 12v31m-20 53v35" stroke-width="2" />
  </g>
  <g fill="#67e8f9">
    <circle cx="820" cy="54" r="5" />
    <circle cx="1052" cy="78" r="5" />
    <circle cx="875" cy="126" r="4" />
    <circle cx="805" cy="210" r="4" />
  </g>

  <g fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="86" y="112" font-size="22" letter-spacing="5" fill="#7dd3fc">BACK-END DEVELOPMENT</text>
    <text x="82" y="172" font-size="54" font-weight="700">YURI WALCZAK</text>
    <rect x="86" y="196" width="250" height="4" rx="2" fill="url(#accent)" />
    <text x="86" y="238" font-size="20" fill="#cbd5e1">Python · FastAPI · PostgreSQL · APIs REST</text>
  </g>
</svg>
